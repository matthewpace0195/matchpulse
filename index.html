<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MatchPulse - Fan Matchday Survey</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-50 text-slate-900 font-sans min-h-screen flex flex-col justify-center items-center p-4">

    <!-- FAN SURVEY CARD -->
    <div class="max-w-md w-full bg-white border border-slate-200 rounded-3xl shadow-xl overflow-hidden border-t-4 border-t-indigo-600">
        <div class="bg-gradient-to-br from-indigo-900 via-indigo-800 to-slate-900 p-6 text-center relative text-white">
            <div class="inline-flex items-center gap-1.5 bg-emerald-500/20 border border-emerald-400/30 px-3 py-1 rounded-full text-xs font-semibold text-emerald-300 mb-3">
                <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span> WildApricot Ticket Verified
            </div>
            <h2 class="text-2xl font-extrabold">Matchday Feedback</h2>
            <p class="text-indigo-200 text-xs mt-1">Help your club elevate the matchday experience</p>
        </div>

        <div class="p-6 space-y-6">
            <!-- Step 1: NPS 0-10 Rating -->
            <div id="step-nps" class="space-y-4">
                <label class="block text-sm font-semibold text-slate-800 text-center">
                    On a scale of 0 to 10, how likely are you to recommend attending a match to a friend or colleague?
                </label>
                <div class="grid grid-cols-11 gap-1">
                    <script>
                        for(let i=0; i<=10; i++) {
                            document.write(`<button onclick="selectScore(${i})" id="score-${i}" class="h-11 rounded-lg bg-slate-100 hover:bg-indigo-600 hover:text-white text-xs font-bold text-slate-700 transition-all border border-slate-200 hover:scale-105">${i}</button>`);
                        }
                    </script>
                </div>
                <div class="flex justify-between text-[11px] text-slate-500 font-medium px-1">
                    <span class="text-rose-600 font-semibold">0 - Not Likely</span>
                    <span class="text-amber-600 font-semibold">7-8 Neutral</span>
                    <span class="text-emerald-600 font-semibold">10 - Extremely Likely</span>
                </div>
            </div>

            <!-- Step 2: Diagnostic Factors & Feedback Text -->
            <div id="step-details" class="space-y-4 hidden transition-all">
                <div class="pt-2 border-t border-slate-100">
                    <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-2">What influenced your score the most?</label>
                    <div class="grid grid-cols-2 gap-2">
                        <button onclick="toggleFactor('Ticketing')" id="factor-Ticketing" class="p-3 rounded-xl border border-slate-200 bg-slate-50 text-xs font-medium text-slate-700 text-left hover:border-indigo-600 transition-all flex items-center gap-2">🎟️ Ticketing & Entry</button>
                        <button onclick="toggleFactor('Concessions')" id="factor-Concessions" class="p-3 rounded-xl border border-slate-200 bg-slate-50 text-xs font-medium text-slate-700 text-left hover:border-indigo-600 transition-all flex items-center gap-2">🍔 Food & Refreshments</button>
                        <button onclick="toggleFactor('Atmosphere')" id="factor-Atmosphere" class="p-3 rounded-xl border border-slate-200 bg-slate-50 text-xs font-medium text-slate-700 text-left hover:border-indigo-600 transition-all flex items-center gap-2">🏟️ Stadium Atmosphere</button>
                        <button onclick="toggleFactor('Parking')" id="factor-Parking" class="p-3 rounded-xl border border-slate-200 bg-slate-50 text-xs font-medium text-slate-700 text-left hover:border-indigo-600 transition-all flex items-center gap-2">🅿️ Parking</button>
                        <button onclick="toggleFactor('Accessibility')" id="factor-Accessibility" class="p-3 rounded-xl border border-slate-200 bg-slate-50 text-xs font-medium text-slate-700 text-left hover:border-indigo-600 transition-all flex items-center gap-2">♿ Accessibility</button>
                        <button onclick="toggleFactor('Other')" id="factor-Other" class="p-3 rounded-xl border border-slate-200 bg-slate-50 text-xs font-medium text-slate-700 text-left hover:border-indigo-600 transition-all flex items-center gap-2">❓ Other</button>
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1.5">Additional Matchday Comments</label>
                    <textarea id="feedback-text" rows="3" placeholder="Tell us what went well or what needs improvement..." class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 text-sm text-slate-900 focus:outline-none focus:border-indigo-600 focus:ring-1 focus:ring-indigo-600 transition-all"></textarea>
                </div>

                <button onclick="submitSurvey()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3.5 rounded-xl transition-all shadow-lg shadow-indigo-600/30 flex items-center justify-center gap-2">
                    <span>Submit Feedback</span>
                    <i data-lucide="send" class="w-4 h-4"></i>
                </button>
            </div>

            <!-- Step 3: Success State -->
            <div id="step-success" class="hidden text-center py-6 space-y-4">
                <div class="bg-emerald-50 border border-emerald-200 text-emerald-600 w-16 h-16 rounded-full flex items-center justify-center mx-auto text-3xl shadow-inner">✓</div>
                <div>
                    <h3 class="text-xl font-bold text-slate-900">Thank You for Your Feedback!</h3>
                    <p class="text-xs text-slate-500 mt-1">Your response has been logged and sent directly to the club management team.</p>
                </div>
                <button onclick="resetSurvey()" class="text-xs text-slate-500 hover:text-slate-800 underline pt-2">Submit another response</button>
            </div>
        </div>
    </div>

    <footer class="mt-6 text-center text-xs text-slate-400">MatchPulse &bull; Fan Matchday Survey</footer>

    <script>
        lucide.createIcons();
        let currentScore = null;
        let selectedFactors = [];

        function selectScore(score) {
            currentScore = score;
            for(let i=0; i<=10; i++) {
                const btn = document.getElementById(`score-${i}`);
                if(i === score) {
                    btn.className = "h-11 rounded-lg bg-indigo-600 text-white text-xs font-bold ring-2 ring-indigo-400 scale-105 transition-all shadow-md shadow-indigo-600/30";
                } else {
                    btn.className = "h-11 rounded-lg bg-slate-100 hover:bg-indigo-600 hover:text-white text-xs font-bold text-slate-700 transition-all border border-slate-200";
                }
            }
            document.getElementById('step-details').classList.remove('hidden');
        }

        function toggleFactor(factor) {
            const btn = document.getElementById(`factor-${factor}`);
            const index = selectedFactors.indexOf(factor);
            if(index > -1) {
                selectedFactors.splice(index, 1);
                btn.className = "p-3 rounded-xl border border-slate-200 bg-slate-50 text-xs font-medium text-slate-700 text-left hover:border-indigo-600 transition-all flex items-center gap-2";
            } else {
                selectedFactors.push(factor);
                btn.className = "p-3 rounded-xl border border-indigo-600 bg-indigo-50 text-xs font-semibold text-indigo-700 text-left transition-all flex items-center gap-2";
            }
        }

        function submitSurvey() {
            if (currentScore === null) return;

            const comment = document.getElementById('feedback-text').value;
            const isPromoter = currentScore >= 9;
            const isPassive = currentScore >= 7 && currentScore <= 8;
            
            let type = isPromoter ? 'Promoter' : (isPassive ? 'Passive' : 'Detractor');
            let initialStatus = isPromoter ? 'Loyal Fan' : (isPassive ? 'Neutral' : 'Pending Action');
            
            // Get existing data from browser storage or start empty
            let existingData = JSON.parse(localStorage.getItem('matchpulse_feedback') || '[]');

            existingData.unshift({
                id: Date.now(),
                name: "Verified Ticket Buyer (WildApricot)",
                score: currentScore,
                type: type,
                factor: selectedFactors.join(', ') || 'Other',
                comment: comment || 'No comment provided.',
                status: initialStatus
            });

            // Save back to shared browser storage
            localStorage.setItem('matchpulse_feedback', JSON.stringify(existingData));

            document.getElementById('step-details').classList.add('hidden');
            document.getElementById('step-nps').classList.add('hidden');
            document.getElementById('step-success').classList.remove('hidden');
        }

        function resetSurvey() {
            currentScore = null;
            selectedFactors = [];
            document.getElementById('feedback-text').value = '';
            document.getElementById('step-success').classList.add('hidden');
            document.getElementById('step-nps').classList.remove('hidden');
            for(let i=0; i<=10; i++) {
                document.getElementById(`score-${i}`).className = "h-11 rounded-lg bg-slate-100 hover:bg-indigo-600 hover:text-white text-xs font-bold text-slate-700 transition-all border border-slate-200";
            }
            ['Ticketing', 'Concessions', 'Atmosphere', 'Parking', 'Accessibility', 'Other'].forEach(factor => {
                document.getElementById(`factor-${factor}`).className = "p-3 rounded-xl border border-slate-200 bg-slate-50 text-xs font-medium text-slate-700 text-left hover:border-indigo-600 transition-all flex items-center gap-2";
            });
        }
    </script>
</body>
</html>
